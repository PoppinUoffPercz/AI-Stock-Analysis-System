name: Backtest Engine CI

on:
  push:
    branches: [main, master]
  pull_request:

defaults:
  run:
    working-directory: backtest-engine

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy src
      - run: python -m pytest

  optional-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,execution]"
      - run: python -c "import nautilus_trader; from backtest_engine.strategy.adapters.nautilus_adapter import NautilusAdapter; print(nautilus_trader.__version__, NautilusAdapter.name)"
      - run: pytest -q tests/test_m5_portability.py tests/test_m8_cli.py -k "nautilus or replay"

  optional-reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,reporting]"
      - run: python -c "import matplotlib, plotly, quantstats; print(matplotlib.__version__, plotly.__version__, quantstats.__version__)"
      - run: pytest -q tests/test_m7_reporting.py
