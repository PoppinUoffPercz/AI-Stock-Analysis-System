repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - numpy>=1.26
          - pandas>=2.1
          - pandas-stubs>=2.3.3,<3
          - pydantic>=2.5
          - types-requests>=2.31
        args: [--config-file=backtest-engine/pyproject.toml, backtest-engine/src]
        pass_filenames: false
  - repo: local
    hooks:
      - id: pytest
        name: pytest (smoke)
        entry: pytest
        language: system
        args: ["-m", "smoke", "--tb=short"]
        pass_filenames: false
        stages: [commit]
