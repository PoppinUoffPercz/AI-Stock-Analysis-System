[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "scion-omaha-bots"
version = "0.1.0"
description = "Scion and Omaha stock research and paper-tracking tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "tabulate>=0.9.0",
  "websockets>=11.0",
  "yfinance>=1.5.0",
]

[project.optional-dependencies]
research = [
  "openbb>=4.7.2",
  "openbb-mcp-server>=1.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scion_omaha_bots"]
